name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project-v*.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the newest project zip
        run: |
          ZIP=$(ls project-v*.zip | sort -V | tail -n 1)
          echo "Using $ZIP"
          unzip -o "$ZIP"

      - name: Download rounded font
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/LilitaOne-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/lilitaone/LilitaOne-Regular.ttf || echo "Font download failed, fallback font will be used"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug -PbuildNumber=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: AutoCaptions-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK in a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: AutoCaptions APK ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
